name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: bep_viet_test
          POSTGRES_USER: bep_viet
          POSTGRES_PASSWORD: bep_viet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bep_viet -d bep_viet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BEP_VIET_APP_ENV: test
      BEP_VIET_DATABASE_URL: postgresql+psycopg://bep_viet:bep_viet_test@localhost:5432/bep_viet_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        working-directory: backend
        run: ruff format --check .
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Type check
        working-directory: backend
        run: mypy app
      - name: Test
        working-directory: backend
        run: pytest
      - name: Validate migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Build backend image
        run: docker build -t bep-viet-api:ci backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.15.0"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.28.0 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend quality gate
        run: pnpm frontend:check
      - name: Build frontend
        run: pnpm frontend:build
      - name: Build frontend image
        run: docker build -t bep-viet-web:ci frontend
