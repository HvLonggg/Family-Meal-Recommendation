[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bep-viet-api"
version = "0.1.0"
description = "API cho sản phẩm lập kế hoạch bữa ăn Bếp Việt"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "anthropic==1.15.0",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "pwdlib[argon2]==0.3.1",
  "PyJWT==2.15.0",
  "sqlalchemy==2.1.1",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.13.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["sqlalchemy.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
